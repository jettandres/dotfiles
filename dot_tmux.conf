set-option -g default-shell /bin/fish
setw -g mode-keys vi

set-option -sa terminal-features ',xterm-256color:RGB'

# remap prefix 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# easy reload for tmux.conf
bind r source-file ~/.tmux.conf

# switch panes
bind -r h select-pane -L
bind -r l select-pane -R
bind -r k select-pane -U
bind -r j select-pane -D

# unbind default switch panes
unbind Up
unbind Down
unbind Left
unbind Right

# bind resize panes
bind -r M-k resize-pane -U 5
bind -r M-j resize-pane -D 5
bind -r M-h resize-pane -L 5
bind -r M-l resize-pane -R 5

# unbind default resize panes
unbind M-Up
unbind M-Down
unbind M-Left
unbind M-Right

# toggle sending command to all panes
bind a setw synchronize-panes

# enable mouse selection on windows
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# update repeat time from 500ms to 1s
set-option -g repeat-time 250

# set escape time for nvim
set-option -sg escape-time 10

# set focus-events for nvim
set-option -g focus-events on

# moving windows
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# set default directory for new windows in this session to current directory:
bind M-c attach-session -c "#{pane_current_path}"

# open a new window in the current directory
bind c new-window -c "#{pane_current_path}"

# Base16 colors for Tmux
set -g mode-style "fg=#e2e98f,bg=#3b4261"

set -g message-style "fg=#e2e98f,bg=#3b4261"
set -g message-command-style "fg=#e2e98f,bg=#3b4261"

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#e2e98f"

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=#e2e98f,bg=#3a475e"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#1d3245,bg=#e2e98f,bold] #{session_name} "
set -g status-right "#[fg=#e2e98f,bg=#606b81]  #(sensors | grep 'Tctl:' | awk '{print \$2}') |  #(free -h | awk '/Mem:/ {print \$7}') #[fg=#e2e98f,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#1d3245,bg=#e2e98f,bold]  %H:%M 󰃰 %m/%d #[fg=#e2e98f,bg=#3b4261]"

setw -g window-status-activity-style "underscore,fg=#a9b1d6,bg=#1f2335"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a9b1d6,bg=#1f2335"
setw -g window-status-format "#[fg=#7c879d,bg=#3a475e,nobold,nounderscore,noitalics] #I #W "
setw -g window-status-current-format "#[fg=#e2e98f,bg=#606b81,nobold,nounderscore,noitalics] #I #W "

set -g status-interval 5

# source .tmux.conf
bind r source-file ~/.tmux.conf

# plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
#set -g @resurrect-capture-pane-contents 'on'

# plugin options
#set -g @continuum-boot 'on'
#set -g @continuum-boot-options 'alacritty'
#set -g @continuum-restore 'on'

# truecolor setup

set-option -a terminal-features 'foot:RGB'


set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ",xterm-256color*:Tc"
# set -ga terminal-overrides ",xterm-256color*:RGB"

# undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Initialize TMUX plugin manager
run `~/.tmux/plugins/tpm/tpm`

# tmux-resurrect sessions
set -g @resurrect-strategy-vim 'session'
