[env]
TERM = "xterm-256color"

[font]
size = 15.0

[font.bold]
family = "UbuntuMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "UbuntuMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "UbuntuMono Nerd Font"
style = "Italic"

[font.normal]
family = "UbuntuMono Nerd Font"
style = "Regular"

[shell]
program = "/bin/fish"

[window]
opacity = 0.95

[window.dimensions]
columns = 125
lines = 30
